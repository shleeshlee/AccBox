<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>AccBox · 共享的安全码</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' dominant-baseline='central' text-anchor='middle' font-size='80'>🍯</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
:root{
  color-scheme:dark;
  --bg:#0a0e17;--card:#111827;--hover:#1a2332;--input:#0d1219;
  --border:#1e293b;--border-light:#334155;
  --text:#f1f5f9;--text-2:#94a3b8;--muted:#64748b;
  --accent:#8b5cf6;--accent-light:#a78bfa;--accent-dim:rgba(139,92,246,.15);
  --gold:#f59e0b;--gold-2:#fbbf24;--green:#22c55e;--red:#ef4444;
  --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:'Noto Sans SC',system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;
  background-image:radial-gradient(60% 40% at 50% -10%,rgba(139,92,246,.18),transparent 70%);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 48px}
button{font:inherit;cursor:pointer}
[hidden]{display:none!important}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:6px}
.brand{display:flex;align-items:center;gap:10px}
.brand .pot{font-size:26px}
.brand h1{margin:0;font-size:20px;font-weight:700;background:linear-gradient(135deg,var(--gold),#fb923c);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;color:var(--text-2);font-size:12px;font-weight:400}
.owner{color:var(--text-2);font-size:13px;margin:0 0 18px}
.owner b{color:var(--text);font-weight:500}
.tick{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:0 0 10px;letter-spacing:.04em;text-transform:uppercase}
.tick .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 8px var(--green)}
.tick .dot.off{background:var(--muted);box-shadow:none}
.list{display:grid;gap:10px}
.acc{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 14px 12px;display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center}
.acc .head{display:flex;align-items:center;gap:8px;min-width:0}
.acc .flag{font-size:18px}
.acc .name{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc .svc{font-size:11px;color:var(--accent-light);background:var(--accent-dim);padding:2px 7px;border-radius:99px;white-space:nowrap}
.acc .mail{grid-column:1;font-family:var(--mono);font-size:12.5px;color:var(--text-2);display:flex;gap:6px;align-items:center;min-width:0}
.acc .mail span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:10px}
.code .num{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.14em;color:var(--gold-2);font-variant-numeric:tabular-nums;text-shadow:0 0 18px rgba(245,158,11,.35)}
.code .num.soon{color:var(--red);text-shadow:none}
.code .num.steam{font-size:26px;letter-spacing:.2em}
.ring{width:34px;height:34px;flex:none}
.ring circle{fill:none;stroke-width:3.5}
.ring .bg{stroke:var(--border-light)}
.ring .fg{stroke:var(--gold);stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
.ring .fg.soon{stroke:var(--red)}
.acc .foot{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--border);padding-top:10px;margin-top:2px}
.chip{border:1px solid var(--border-light);background:var(--input);color:var(--text-2);border-radius:8px;padding:5px 10px;font-size:12.5px;display:inline-flex;gap:5px;align-items:center;max-width:100%}
.chip:hover{background:var(--hover);color:var(--text)}
.chip.primary{background:linear-gradient(135deg,var(--gold),#f97316);color:#1a1200;border-color:transparent;font-weight:700}
.chip .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pw{font-family:var(--mono);font-size:12.5px;color:var(--text-2);margin-left:auto;display:flex;gap:6px;align-items:center}
.pw code{background:var(--input);padding:3px 7px;border-radius:6px;color:var(--text);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note-edit{grid-column:1/3;display:none;gap:8px}
.note-edit.open{display:grid}
.note-edit textarea,.note-edit input,.field input{width:100%;background:var(--input);border:1px solid var(--border-light);border-radius:8px;color:var(--text);padding:9px 10px;font:inherit;font-size:14px}
.note-edit .row{display:flex;gap:6px;justify-content:flex-end}
.acc.nocode .code .num{font-size:13px;letter-spacing:0;color:var(--muted);text-shadow:none;font-family:var(--sans);font-weight:400;max-width:120px;text-align:right}
.mailcodes{margin-top:18px;border:1px solid var(--border);border-radius:14px;padding:12px 14px;background:rgba(17,24,39,.6)}
.mailcodes h2{margin:0 0 6px;font-size:13px;color:var(--text-2);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.mailcodes .item{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0}
.mailcodes .item b{font-family:var(--mono);font-size:18px;letter-spacing:.1em;color:var(--text)}
.mailcodes .item .who{color:var(--text-2);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mailcodes .item .ago{color:var(--muted);font-size:12px}
.mailcodes .empty{color:var(--muted);font-size:12.5px;padding:4px 0}
.foot-note{margin-top:22px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px}
.foot-note .reg{color:var(--accent-light);text-decoration:none;border:1px solid var(--border-light);padding:6px 10px;border-radius:8px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--card);border:1px solid var(--border-light);color:var(--text);padding:9px 16px;border-radius:10px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:90vw;z-index:50}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.err{border-color:var(--red)}
/* 解锁 / 状态屏 */
.gate{max-width:380px;margin:12vh auto 0;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:26px 22px;display:grid;gap:14px;text-align:center}
.gate .pot{font-size:44px}
.gate h2{margin:0;font-size:18px}
.gate p{margin:0;color:var(--text-2);font-size:13.5px}
.gate .field input{text-align:center;font-family:var(--mono);font-size:22px;letter-spacing:.3em;padding:12px}
.btn{border:0;border-radius:10px;padding:12px 16px;font-weight:700;background:linear-gradient(135deg,var(--gold),#f97316);color:#1a1200;font-size:15px}
.btn:disabled{opacity:.5;cursor:wait}
.gate .err{color:var(--red);font-size:13px;min-height:1.2em}
/* 转正弹层 */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);display:flex;align-items:center;justify-content:center;padding:16px;z-index:40}
.sheet{background:var(--card);border:1px solid var(--border-light);border-radius:16px;padding:18px;width:100%;max-width:400px;display:grid;gap:12px}
.sheet h3{margin:0;font-size:16px}
.sheet p{margin:0;color:var(--text-2);font-size:13px}
.sheet .tabs{display:flex;background:var(--input);border-radius:10px;padding:3px}
.sheet .tabs button{flex:1;border:0;background:transparent;color:var(--text-2);padding:8px;border-radius:8px}
.sheet .tabs button[aria-selected="true"]{background:var(--accent);color:#fff}
.sheet .row{display:flex;gap:8px;justify-content:flex-end}
.field{display:grid;gap:4px;font-size:12.5px;color:var(--text-2);text-align:left}
@media (max-width:480px){
  .acc{grid-template-columns:1fr}
  .code{grid-column:1;grid-row:auto;justify-content:space-between;padding-top:4px}
  .acc .foot{grid-column:1}
  .note-edit{grid-column:1}
}
@media (prefers-reduced-motion:reduce){.ring .fg{transition:none}.toast{transition:none}}
    </style>
</head>
<body>
<div class="wrap">
    <!-- 解锁屏 -->
    <section class="gate" id="gate">
        <div class="pot">🍯</div>
        <h2 id="gateTitle">共享的安全码</h2>
        <p id="gateDesc">正在打开…</p>
        <form id="pinForm" hidden>
            <div class="field"><input id="pin" inputmode="numeric" autocomplete="one-time-code" placeholder="口令" maxlength="16" aria-label="口令"></div>
            <div class="err" id="pinErr"></div>
            <button class="btn" id="pinBtn" type="submit" style="width:100%">打开</button>
            <p style="margin-top:10px">口令问分享给你的人要。输对一次，这台设备就记住了。</p>
        </form>
    </section>

    <!-- 主页面 -->
    <section id="main" hidden>
        <div class="top">
            <div class="brand"><span class="pot">🍯</span><h1>AccBox<small>共享的账号安全码</small></h1></div>
            <button class="chip" id="lock" title="换设备时用">退出</button>
        </div>
        <p class="owner" id="ownerLine"></p>
        <div class="tick"><span><span class="dot" id="dot"></span><span id="tickText">自动刷新，不用点</span></span><span id="clock">--</span></div>
        <div class="list" id="list"></div>
        <div class="mailcodes" id="mailbox" hidden>
            <h2><span>邮箱验证码（这几个账号的邮箱）</span><button class="chip" id="mailRefresh">刷新</button></h2>
            <div id="mailList"><div class="empty">最近 5 分钟没有新邮件</div></div>
        </div>
        <div class="foot-note">
            <span id="footText">这个页面只对分享的账号有效，分享者随时可以关掉</span>
            <a class="reg" href="/" target="_blank" rel="noopener">注册自己的 AccBox 账号，享受完整版账号管理 →</a>
        </div>
    </section>
</div>

<div class="toast" id="toast"></div>
<script src="/share.js?v=20260926"></script>
</body>
</html>
