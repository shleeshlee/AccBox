<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <title>AccBox</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text x='50' y='50' dominant-baseline='central' text-anchor='middle' font-size='80'>🍯</text></svg>">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;600&family=JetBrains+Mono&family=Orbitron:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- 复用主程序样式：颜色变量、亮暗主题、四季主题、标题栏、toast -->
    <link rel="stylesheet" href="/style.css?v=20260926b">
    <style>
/* 分享页自己的布局，类名全部 sh- 前缀，颜色只用主程序的变量 */
[hidden]{display:none!important}
.sh-wrap{max-width:720px;margin:0 auto;padding:0 16px 48px}
.sh-wrap .sidebar-header{padding:14px 0;margin-bottom:14px}
.sh-wrap .btn-header.sh-text{width:auto;padding:0 10px;font-size:.85rem}
.sh-tick{display:flex;justify-content:space-between;align-items:center;font-size:.78rem;color:var(--text-muted);margin:0 0 10px}
.sh-tick .sh-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:6px;box-shadow:0 0 8px var(--green)}
.sh-tick .sh-dot.off{background:var(--text-muted);box-shadow:none}
.sh-owner{color:var(--text-secondary);font-size:.9rem;margin:0 0 14px}
.sh-owner b{color:var(--text-primary);font-weight:500}
.sh-list{display:grid;gap:10px}
.sh-acc{background:var(--bg-card);border:1px solid var(--border);border-radius:14px;padding:14px 14px 12px;display:grid;grid-template-columns:1fr auto;gap:10px 14px;align-items:center}
.sh-acc:hover{border-color:var(--season-accent,var(--accent))}
.sh-head{display:flex;align-items:center;gap:8px;min-width:0}
.sh-flag{font-size:18px}
.sh-name{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sh-svc{font-size:.72rem;color:var(--accent-light);background:var(--accent-dim);padding:2px 7px;border-radius:99px;white-space:nowrap}
.sh-mail{grid-column:1;font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--text-secondary);display:flex;gap:6px;align-items:center;min-width:0}
.sh-mail span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-code{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:10px}
.sh-num{font-family:'JetBrains Mono',monospace;font-size:30px;font-weight:700;letter-spacing:.14em;color:var(--gold);font-variant-numeric:tabular-nums}
.sh-num.soon{color:var(--red)}
.sh-num.steam{font-size:26px;letter-spacing:.2em}
.sh-acc.nocode .sh-num{font-size:.8rem;letter-spacing:0;color:var(--text-muted);font-family:inherit;font-weight:400;max-width:120px;text-align:right}
.sh-ring{width:34px;height:34px;flex:none}
.sh-ring circle{fill:none;stroke-width:3.5}
.sh-ring .bg{stroke:var(--border-light)}
.sh-ring .fg{stroke:var(--season-accent,var(--gold));stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;transition:stroke-dashoffset 1s linear}
.sh-ring .fg.soon{stroke:var(--red)}
.sh-foot{grid-column:1/3;display:flex;gap:6px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--border);padding-top:10px;margin-top:2px}
.sh-chip{border:1px solid var(--border-light);background:var(--bg-input);color:var(--text-secondary);border-radius:8px;padding:5px 10px;font-size:.8rem;display:inline-flex;gap:5px;align-items:center;max-width:100%;cursor:pointer;font-family:inherit}
.sh-chip:hover{background:var(--bg-hover);color:var(--text-primary)}
.sh-chip.primary{background:linear-gradient(135deg,var(--gold),#f97316);color:#1a1200;border-color:transparent;font-weight:600}
.sh-pw{font-family:'JetBrains Mono',monospace;font-size:.8rem;color:var(--text-secondary);margin-left:auto;display:flex;gap:6px;align-items:center}
.sh-pw code{background:var(--bg-input);padding:3px 7px;border-radius:6px;color:var(--text-primary);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-edit{grid-column:1/3;display:none;gap:8px}
.sh-edit.open{display:grid}
.sh-edit textarea,.sh-edit input,.sh-field input{width:100%;background:var(--bg-input);border:1px solid var(--border-light);border-radius:8px;color:var(--text-primary);padding:9px 10px;font:inherit;font-size:.9rem}
.sh-edit textarea{resize:vertical;min-height:60px;white-space:pre-wrap}
.sh-edit .row{display:flex;gap:6px;justify-content:flex-end}
.sh-note{grid-column:1/3;font-size:.82rem;color:var(--text-secondary);white-space:pre-wrap;word-break:break-word;padding:0 2px}
.sh-mailbox{margin-top:18px;border:1px solid var(--border);border-radius:14px;padding:12px 14px;background:var(--bg-card)}
.sh-mailbox h2{margin:0 0 6px;font-size:.85rem;color:var(--text-secondary);font-weight:500;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sh-mailbox .item{display:flex;align-items:center;gap:10px;font-size:.85rem;padding:6px 0}
.sh-mailbox .item b{font-family:'JetBrains Mono',monospace;font-size:18px;letter-spacing:.1em;color:var(--text-primary)}
.sh-mailbox .item .who{color:var(--text-secondary);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sh-mailbox .item .ago{color:var(--text-muted);font-size:.75rem}
.sh-mailbox .empty{color:var(--text-muted);font-size:.8rem;padding:4px 0}
.sh-bottom{margin-top:22px;text-align:right}
.sh-bottom a{color:var(--accent-light);font-size:.82rem;text-decoration:none}
.sh-bottom a:hover{text-decoration:underline}
/* 口令屏 */
.sh-gate{max-width:380px;margin:10vh auto 0;background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:26px 22px;display:grid;gap:14px;text-align:center}
.sh-gate .pot{font-size:44px}
.sh-gate h2{margin:0;font-size:1.1rem}
.sh-gate p{margin:0;color:var(--text-secondary);font-size:.88rem}
.sh-gate .sh-field input{text-align:center;font-family:'JetBrains Mono',monospace;font-size:22px;letter-spacing:.3em;padding:12px}
.sh-btn{border:0;border-radius:10px;padding:12px 16px;font-weight:600;background:linear-gradient(135deg,var(--gold),#f97316);color:#1a1200;font-size:.95rem;cursor:pointer;font-family:inherit;width:100%}
.sh-btn:disabled{opacity:.5;cursor:wait}
.sh-err{color:var(--red);font-size:.85rem;min-height:1.2em}
@media (max-width:480px){
  .sh-acc{grid-template-columns:1fr}
  .sh-code{grid-column:1;grid-row:auto;justify-content:space-between;padding-top:4px}
  .sh-foot,.sh-edit,.sh-note{grid-column:1}
}
@media (prefers-reduced-motion:reduce){.sh-ring .fg{transition:none}}
    </style>
</head>
<body>
<div class="sh-wrap">
    <div class="sidebar-header">
        <div class="logo"><span>🍯</span><span>AccBox</span></div>
        <div class="header-btns">
            <button class="btn-header" id="themeBtn" title="切换亮/暗">🌙</button>
            <button class="btn-header sh-text" id="lock" title="退出后要重新输口令" hidden>退出</button>
        </div>
    </div>

    <!-- 口令屏 -->
    <section class="sh-gate" id="gate">
        <div class="pot">🍯</div>
        <h2 id="gateTitle">口令登录</h2>
        <p id="gateDesc">正在打开…</p>
        <form id="pinForm" hidden>
            <div class="sh-field"><input id="pin" inputmode="numeric" autocomplete="one-time-code" placeholder="口令" maxlength="16" aria-label="口令"></div>
            <div class="sh-err" id="pinErr"></div>
            <button class="sh-btn" id="pinBtn" type="submit">打开</button>
        </form>
    </section>

    <!-- 主页面 -->
    <section id="main" hidden>
        <p class="sh-owner" id="ownerLine"></p>
        <div class="sh-tick"><span><span class="sh-dot" id="dot"></span><span id="tickText">自动刷新</span></span><span id="clock">--</span></div>
        <div class="sh-list" id="list"></div>
        <div class="sh-mailbox" id="mailbox" hidden>
            <h2><span>邮箱验证码</span><button class="sh-chip" id="mailRefresh">刷新</button></h2>
            <div id="mailList"><div class="empty">最近 5 分钟没有新邮件</div></div>
        </div>
        <div class="sh-bottom"><a href="/#register" target="_blank" rel="noopener">注册 AccBox 账号 →</a></div>
    </section>
</div>
<div class="toast" id="toast"></div>
<script src="/share.js?v=20260926b"></script>
</body>
</html>
