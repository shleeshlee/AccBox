[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
stderr_logfile=/var/log/nginx/error.log
stdout_logfile=/var/log/nginx/access.log


[program:init]
command=sh -c "chown -R appuser:appuser /app/data /app/backups 2>/dev/null; exit 0"
autostart=true
autorestart=false
startsecs=0
priority=1

[program:api]
command=python3 /app/main.py
user=appuser
priority=10
startsecs=2
directory=/app
autostart=true
autorestart=true
stderr_logfile=/var/log/api.err.log
stdout_logfile=/var/log/api.out.log
environment=PORT="9111",DATA_DIR="/app/data"
